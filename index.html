<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IG 內容規劃報告｜品牌顧問</title>
<style>
  :root{
    --bg:#fbf5ec;
    --bg-alt:#f3e6d3;
    --panel:#ffffff;
    --panel-raised:#fffaf3;
    --line:#e3d2b8;
    --line-soft:#ecdfc8;
    --text:#3a2b1e;
    --text-dim:#6b5844;
    --text-faint:#9c8a72;
    --brown:#6f4a2f;
    --amber:#c9822c;
    --teal:#2f7a6e;
    --red:#b8523c;
    --font-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211812;
      --bg-alt:#2b2019;
      --panel:#2c2119;
      --panel-raised:#332619;
      --line:#4a3a2a;
      --line-soft:#3c2f22;
      --text:#f3e9db;
      --text-dim:#cbb89e;
      --text-faint:#96826a;
      --brown:#e0b083;
      --amber:#e3a34f;
      --teal:#5fb8a8;
      --red:#e08268;
    }
  }
  :root[data-theme="dark"]{
    --bg:#211812;
    --bg-alt:#2b2019;
    --panel:#2c2119;
    --panel-raised:#332619;
    --line:#4a3a2a;
    --line-soft:#3c2f22;
    --text:#f3e9db;
    --text-dim:#cbb89e;
    --text-faint:#96826a;
    --brown:#e0b083;
    --amber:#e3a34f;
    --teal:#5fb8a8;
    --red:#e08268;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    line-height:1.65;
  }
  .wrap{max-width:980px;margin:0 auto;padding:32px 20px 60px;}

  header.hero{
    background:linear-gradient(135deg,var(--brown),var(--amber));
    border-radius:var(--radius);
    padding:32px 28px;
    color:#fff9f0;
    margin-bottom:28px;
  }
  header.hero .eyebrow{
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;margin-bottom:8px;
  }
  header.hero h1{margin:0 0 6px;font-size:clamp(22px,3.4vw,30px);}
  header.hero .tagline{font-size:15px;opacity:.92;margin-bottom:18px;}
  .brand-meta{display:flex;flex-wrap:wrap;gap:8px;}
  .brand-meta span{
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.3);
    border-radius:999px;
    padding:4px 12px;
    font-size:13px;
  }

  .consultant-note{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--amber);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:32px;
    font-size:14.5px;
    color:var(--text-dim);
  }
  .consultant-note b{color:var(--text);}

  section{margin-bottom:36px;}
  h2{
    font-size:19px;
    margin:0 0 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2 .num{
    background:var(--brown);
    color:#fff9f0;
    width:26px;height:26px;
    border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:13px;
  }

  .week-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:14px;
  }
  .week-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .week-card .w{
    font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;
  }
  .week-card .t{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text);}
  .week-card .g{font-size:13.5px;color:var(--text-dim);}

  .table-scroll{
    overflow-x:auto;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--panel);
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:720px;
    font-size:13.5px;
  }
  thead th{
    text-align:left;
    background:var(--bg-alt);
    color:var(--text-dim);
    font-weight:700;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{
    padding:12px 14px;
    border-bottom:1px solid var(--line-soft);
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel-raised);}
  .week-badge{
    display:inline-block;
    background:var(--bg-alt);
    color:var(--text-dim);
    border-radius:6px;
    padding:2px 8px;
    font-size:12px;
    white-space:nowrap;
  }
  .type-badge{
    display:inline-block;
    border-radius:999px;
    padding:3px 10px;
    font-size:12px;
    font-weight:700;
    white-space:nowrap;
  }
  .type-圖文{background:#dfe9dd;color:#2f5c3f;}
  .type-短影音{background:#f0dfe0;color:var(--red);}
  .type-限動{background:#e0e6f0;color:#33507a;}
  :root[data-theme="dark"] .type-圖文{background:#2e3f2f;color:#a9d9b2;}
  :root[data-theme="dark"] .type-短影音{background:#4a2c2c;color:#f0b3a3;}
  :root[data-theme="dark"] .type-限動{background:#28324a;color:#a9bde0;}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .type-圖文{background:#2e3f2f;color:#a9d9b2;}
    :root:not([data-theme="light"]) .type-短影音{background:#4a2c2c;color:#f0b3a3;}
    :root:not([data-theme="light"]) .type-限動{background:#28324a;color:#a9bde0;}
  }
  .copy-cell{max-width:320px;color:var(--text-dim);}
  .theme-cell{font-weight:600;color:var(--text);white-space:nowrap;}
  .hashtags{color:var(--teal);font-size:12.5px;}

  .tips-list{
    display:grid;
    gap:10px;
    padding:0;
    margin:0;
    list-style:none;
  }
  .tips-list li{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    font-size:14px;
    color:var(--text-dim);
    display:flex;
    gap:10px;
  }
  .tips-list li::before{
    content:"☕";
    flex:none;
  }

  footer{
    text-align:center;
    font-size:12.5px;
    color:var(--text-faint);
    padding-top:20px;
    border-top:1px solid var(--line-soft);
  }
  footer a{color:var(--text-faint);}

  @media (max-width:560px){
    .wrap{padding:20px 14px 40px;}
    header.hero{padding:24px 20px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="eyebrow">IG 一個月內容規劃・品牌顧問報告</div>
    <h1 id="brand-name"></h1>
    <div class="tagline" id="brand-tagline"></div>
    <div class="brand-meta" id="brand-meta"></div>
  </header>

  <div class="consultant-note" id="consultant-note"></div>

  <section>
    <h2><span class="num">1</span>四週主題總覽</h2>
    <div class="week-grid" id="week-grid"></div>
  </section>

  <section>
    <h2><span class="num">2</span>貼文計畫表</h2>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>週次</th>
            <th>日期</th>
            <th>貼文類型</th>
            <th>主題</th>
            <th>文案重點</th>
            <th>Hashtag 建議</th>
          </tr>
        </thead>
        <tbody id="post-rows"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2><span class="num">3</span>顧問的可執行建議</h2>
    <ul class="tips-list" id="tips-list"></ul>
  </section>

  <footer>
    製作：Mark Tsai｜<a href="mailto:tsaimark@gmail.com">tsaimark@gmail.com</a>｜內容資料集中於 data.js，替換品牌即可套用到其他店家
  </footer>

</div>

<script src="data.js?v=20260820"></script>
<script>
(function(){
  var D = window.PLANNER_DATA;
  var b = D.brand;

  document.getElementById("brand-name").textContent = b.name;
  document.getElementById("brand-tagline").textContent = b.tagline;

  var metaEl = document.getElementById("brand-meta");
  [b.location, b.stage, b.team, b.audience].forEach(function(txt){
    var span = document.createElement("span");
    span.textContent = txt;
    metaEl.appendChild(span);
  });

  document.getElementById("consultant-note").innerHTML =
    "<b>顧問筆記：</b>" + b.consultantIntro;

  var weekGrid = document.getElementById("week-grid");
  D.weeklyThemes.forEach(function(w){
    var card = document.createElement("div");
    card.className = "week-card";
    card.innerHTML =
      '<div class="w">第 ' + w.week + ' 週</div>' +
      '<div class="t">' + w.title + '</div>' +
      '<div class="g">' + w.goal + '</div>';
    weekGrid.appendChild(card);
  });

  var rowsEl = document.getElementById("post-rows");
  D.posts.forEach(function(p){
    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td><span class="week-badge">第 ' + p.week + ' 週</span></td>' +
      '<td>' + p.day + '</td>' +
      '<td><span class="type-badge type-' + p.type + '">' + p.type + '</span></td>' +
      '<td class="theme-cell">' + p.theme + '</td>' +
      '<td class="copy-cell">' + p.copy + '</td>' +
      '<td class="hashtags">' + p.hashtags.join(" ") + '</td>';
    rowsEl.appendChild(tr);
  });

  var tipsEl = document.getElementById("tips-list");
  D.consultantTips.forEach(function(tip){
    var li = document.createElement("li");
    li.textContent = tip;
    tipsEl.appendChild(li);
  });
})();
</script>
</body>
</html>
